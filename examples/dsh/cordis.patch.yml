# Add this to your DeepSeek Harness profile's cordis.patch.yml.
# 1. Start the control plane:  teamplane serve
# 2. Export a principal token: export TEAMPLANE_TOKEN="tp_..."
# 3. Restart the harness. Tools appear as mcp__teamplane__tp_*.

- id: mcp-teamplane
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: teamplane
    transport: stdio
    command: teamplane
    args: ['mcp']
    failOnStartupError: false
    env:
      TEAMPLANE_URL: http://127.0.0.1:7317
      TEAMPLANE_TOKEN: !!js process.env.TEAMPLANE_TOKEN

# One shared control plane for the whole team (per-user tokens):
# - id: mcp-teamplane-http
