name: teamplane-audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The control plane must be reachable from the runner.
      # For a private network, run this step on a self-hosted runner instead.
      - name: Verify the Teamplane event log
        uses: JustinSian/Teamplane@v0.4.1
        with:
          control-plane-url: ${{ vars.TEAMPLANE_URL }}
          token: ${{ secrets.TEAMPLANE_TOKEN }}
