name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo:ci
      - run: npm run mcp:smoke
      - run: npm pack
      - run: git bundle create teamplane.bundle --all
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            teamplane-*.tgz
            teamplane.bundle
