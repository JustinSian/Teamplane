<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7594"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#070b12"/>

  <text x="40" y="46" fill="#e6edf7" font-size="22" font-weight="700">Teamplane</text>
  <text x="40" y="70" fill="#8fa3bd" font-size="13">five planes, one deterministic control plane</text>

  <!-- callers -->
  <g>
    <rect x="40" y="110" width="180" height="76" rx="10" fill="#0e1624" stroke="#1e2b3d"/>
    <text x="58" y="138" fill="#e6edf7" font-size="14" font-weight="600">alice</text>
    <text x="58" y="158" fill="#8fa3bd" font-size="12">token + mandate</text>
    <text x="58" y="174" fill="#8fa3bd" font-size="12">CLI / console</text>

    <rect x="40" y="202" width="180" height="76" rx="10" fill="#0e1624" stroke="#1e2b3d"/>
    <text x="58" y="230" fill="#e6edf7" font-size="14" font-weight="600">bob</text>
    <text x="58" y="250" fill="#8fa3bd" font-size="12">token + mandate</text>
    <text x="58" y="266" fill="#8fa3bd" font-size="12">CLI / console</text>

    <rect x="40" y="294" width="180" height="76" rx="10" fill="#0e1624" stroke="#1e2b3d"/>
    <text x="58" y="322" fill="#e6edf7" font-size="14" font-weight="600">agents</text>
    <text x="58" y="342" fill="#8fa3bd" font-size="12">DSH · Claude Code</text>
    <text x="58" y="358" fill="#8fa3bd" font-size="12">Cursor · Codex (MCP)</text>
  </g>

  <!-- control plane -->
  <rect x="300" y="104" width="330" height="272" rx="14" fill="#0e1624" stroke="#2a3f5a"/>
  <text x="320" y="132" fill="#b7f36b" font-size="13" font-weight="700" letter-spacing="1">CONTROL PLANE</text>

  <g font-size="13">
    <rect x="320" y="146" width="290" height="38" rx="8" fill="#111c2d" stroke="#1e2b3d"/>
    <text x="336" y="170" fill="#e6edf7">Identity &amp; authority</text>
    <text x="500" y="170" fill="#8fa3bd" font-size="11">Ed25519 mandates</text>

    <rect x="320" y="192" width="290" height="38" rx="8" fill="#111c2d" stroke="#1e2b3d"/>
    <text x="336" y="216" fill="#e6edf7">Policy engine</text>
    <text x="500" y="216" fill="#8fa3bd" font-size="11">deny &gt; ask &gt; allow</text>

    <rect x="320" y="238" width="290" height="38" rx="8" fill="#111c2d" stroke="#1e2b3d"/>
    <text x="336" y="262" fill="#e6edf7">Leases</text>
    <text x="500" y="262" fill="#8fa3bd" font-size="11">typed keys + fencing</text>

    <rect x="320" y="284" width="290" height="38" rx="8" fill="#111c2d" stroke="#1e2b3d"/>
    <text x="336" y="308" fill="#e6edf7">Memory</text>
    <text x="500" y="308" fill="#8fa3bd" font-size="11">ACL + provenance</text>

    <rect x="320" y="330" width="290" height="34" rx="8" fill="#111c2d" stroke="#1e2b3d"/>
    <text x="336" y="352" fill="#e6edf7">Merge gate</text>
    <text x="500" y="352" fill="#8fa3bd" font-size="11">merge-tree + verify</text>
  </g>

  <!-- arrows callers -> plane -->
  <line x1="220" y1="148" x2="298" y2="180" stroke="#5b7594" marker-end="url(#arrow)"/>
  <line x1="220" y1="240" x2="298" y2="240" stroke="#5b7594" marker-end="url(#arrow)"/>
  <line x1="220" y1="332" x2="298" y2="300" stroke="#5b7594" marker-end="url(#arrow)"/>

  <!-- event log -->
  <rect x="700" y="150" width="220" height="150" rx="12" fill="#0e1624" stroke="#2a3f5a"/>
  <text x="720" y="180" fill="#b7f36b" font-size="13" font-weight="700" letter-spacing="1">EVENT LOG</text>
  <text x="720" y="206" fill="#e6edf7" font-size="12">append-only JSONL</text>
  <text x="720" y="226" fill="#8fa3bd" font-size="12">sha256 hash chain</text>
  <text x="720" y="246" fill="#8fa3bd" font-size="12">replay-verified</text>
  <text x="720" y="274" fill="#8fa3bd" font-size="12">→ SSE subscribers</text>
  <line x1="630" y1="230" x2="698" y2="225" stroke="#5b7594" marker-end="url(#arrow)"/>

  <!-- git -->
  <rect x="700" y="330" width="220" height="80" rx="12" fill="#0e1624" stroke="#2a3f5a"/>
  <text x="720" y="360" fill="#e6edf7" font-size="13" font-weight="600">git worktrees</text>
  <text x="720" y="380" fill="#8fa3bd" font-size="12">tp/tsk_... branches</text>
  <text x="720" y="398" fill="#8fa3bd" font-size="12">one per task</text>
  <line x1="630" y1="340" x2="698" y2="360" stroke="#5b7594" marker-end="url(#arrow)"/>

  <!-- bottom rule -->
  <text x="40" y="470" fill="#b7f36b" font-size="13" font-weight="600">No model in the decision path.</text>
  <text x="40" y="492" fill="#8fa3bd" font-size="12">Policy is a pure function; mandates are signatures; leases are containment tests; the gate verifies.</text>
  <text x="40" y="514" fill="#8fa3bd" font-size="12">Coordination is a typed event stream, not a transcript.</text>
</svg>
